<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Trading — Workshop</title>
<meta name="description" content="A hands-on Databricks AI/BI workshop on the energy_trading dataset.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B3139'/%3E%3Cg transform='translate(4 4)'%3E%3Cpath fill='%23FF3621' d='M.95 14.184L12 20.403l9.919-5.55v2.21L12 22.662l-10.484-5.96-.565.308v.77L12 24l11.05-6.218v-4.317l-.515-.309L12 19.118l-9.867-5.653v-2.21L12 16.805l11.05-6.218V6.32l-.515-.308L12 11.974 2.647 6.681 12 1.388l7.76 4.368.668-.411v-.566L12 0 .95 6.27v.72L12 13.207l9.919-5.55v2.26L12 15.52 1.516 9.56l-.565.308Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--navy:#1B3139;--blue:#FF3621;--teal:#1B3139;--purple:#FF5F46;--coral:#FF3621;--grey:#5B6670;--border:#E4DFD5;--ink:#1B3139;--panel:#F1EDE6;--bg:#F7F4EF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#fff;background:var(--navy);line-height:1.55;
  -webkit-font-smoothing:antialiased}
/* Soft radial glow behind the splash */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:96px 24px 40px;overflow:hidden;
  background:radial-gradient(1200px 620px at 50% -8%,#26454f 0%,var(--navy) 62%)}
.hero::after{content:"";position:absolute;left:50%;bottom:-160px;width:520px;height:320px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(255,54,33,.16),transparent 70%);pointer-events:none}

/* Entrance + idle animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.splash{position:relative;z-index:2;max-width:600px}
.splash h1{font-size:clamp(30px,6.4vw,48px);font-weight:600;margin:0 0 16px;line-height:1.1;letter-spacing:-.01em;
  animation:riseUp .8s cubic-bezier(.2,.7,.2,1) .25s both}
.splash h1 .accent{color:var(--coral)}
.splash .sub{font-size:16px;color:#C3CDD1;margin:0 auto 34px;max-width:470px;
  animation:riseUp .8s cubic-bezier(.2,.7,.2,1) .4s both}

.cta{display:inline-flex;align-items:center;gap:10px;background:var(--coral);color:#fff;font-size:17px;font-weight:600;
  padding:16px 34px;border-radius:999px;text-decoration:none;
  box-shadow:0 12px 34px rgba(255,54,33,.38);transition:transform .14s,box-shadow .14s;
  animation:fadeIn .8s ease-out .55s both}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(255,54,33,.5)}
.cta .arrow{transition:transform .14s}
.cta:hover .arrow{transform:translateX(4px)}


/* Brand lockup (logos.js injects the "Databricks x knowit" markup;
   we pull it out of the corner and center it, enlarged, above the title). */
.brandbar{display:inline-flex;align-items:center;gap:14px}
.hero .brandbar.corner{position:relative;order:-1;margin:0 0 34px;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));
  animation:fadeIn 1s ease-out both}
/* soft static coral halo behind the logo lockup */
.hero .brandbar.corner::before{content:"";position:absolute;inset:-38px -24px;z-index:-1;
  background:radial-gradient(closest-side,rgba(255,54,33,.26),transparent 72%);filter:blur(6px);
  pointer-events:none}
.brand-slot{display:inline-flex;align-items:center;line-height:0;text-decoration:none;transition:opacity .12s}
.brand-slot:hover{opacity:.78}
.brand-img{display:block;height:34px;width:auto;max-width:200px;object-fit:contain}
.brand-fallback{display:inline-flex;align-items:center}
.brand-svg{display:block;height:32px;width:auto;flex:none}
.brand-x{color:rgba(255,255,255,.5);font-size:22px;font-weight:300;margin:0 4px}
@media(max-width:560px){.brand-svg{height:26px}.brand-img{height:28px}.brand-x{font-size:18px}}

@media(max-width:560px){
  .hero{padding-top:88px}
}
@media(prefers-reduced-motion:reduce){
  .hero .brandbar.corner,.hero .brandbar.corner::before,.splash h1,.splash .sub,.cta{animation:none;opacity:1}
}
</style></head>
<body>
<div class="hero">
  <div class="splash">
    <h1>Databricks&nbsp;AI/BI<br><span class="accent">hands-on</span></h1>
    <p class="sub">Build a real energy-trading dataset, explore it, and let AI/BI Genie answer questions in plain English — all in a free Databricks workspace.</p>
    <a class="cta" href="home.html">Start the workshop <span class="arrow">→</span></a>
  </div>
</div>
<script src="assets/logos.js?v=6"></script>
</body></html>
