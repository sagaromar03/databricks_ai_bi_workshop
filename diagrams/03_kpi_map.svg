<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-label="KPI map"><rect width="980" height="600" fill="#FFFFFF"/><rect x="0" y="0" width="980" height="58" fill="#0B4F6C"/><text x="28" y="32" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="20" fill="#FFFFFF" text-anchor="start" font-weight="600">KPI map</text><text x="28" y="50" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#CFE0EC" text-anchor="start" font-weight="400">What you can ask — grouped by the business question</text><rect x="28" y="86" width="458" height="142" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><rect x="28" y="86" width="6" height="142" rx="3" fill="#1D9E75"/><text x="50" y="120" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" fill="#1D9E75" text-anchor="start" font-weight="600">1. Activity</text><text x="50" y="144" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">how busy is the market?</text><text x="50" y="174" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">Trade count, total volume, notional, unique</text><text x="50" y="192" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">traders/counterparties</text><rect x="390" y="100" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><text x="431" y="115" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#1D9E75" text-anchor="middle" font-weight="600">pre-built</text><rect x="522" y="86" width="458" height="142" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><rect x="522" y="86" width="6" height="142" rx="3" fill="#1D9E75"/><text x="544" y="120" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" fill="#1D9E75" text-anchor="start" font-weight="600">2. Price</text><text x="544" y="144" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">what price are deals struck at?</text><text x="544" y="174" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">Average price, VWAP (volume-weighted), min / max</text><text x="544" y="192" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">price</text><rect x="884" y="100" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><text x="925" y="115" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#1D9E75" text-anchor="middle" font-weight="600">pre-built</text><rect x="28" y="248" width="458" height="142" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><rect x="28" y="248" width="6" height="142" rx="3" fill="#1D9E75"/><text x="50" y="282" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" fill="#1D9E75" text-anchor="start" font-weight="600">3. Direction</text><text x="50" y="306" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">who is buying vs selling?</text><text x="50" y="336" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">Buy vs sell volume &amp; notional, net long / short</text><text x="50" y="354" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">position</text><rect x="390" y="262" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><text x="431" y="277" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#1D9E75" text-anchor="middle" font-weight="600">pre-built</text><rect x="522" y="248" width="458" height="142" rx="10" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><rect x="522" y="248" width="6" height="142" rx="3" fill="#BA7517"/><text x="544" y="282" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" fill="#BA7517" text-anchor="start" font-weight="600">4. Money</text><text x="544" y="306" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">market-wide sell-side value</text><text x="544" y="336" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">Revenue, trading profit — mixed currencies, handle</text><text x="544" y="354" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">with care</text><rect x="884" y="262" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><text x="925" y="277" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#BA7517" text-anchor="middle" font-weight="600">caveat</text><rect x="28" y="410" width="458" height="142" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><rect x="28" y="410" width="6" height="142" rx="3" fill="#1D9E75"/><text x="50" y="444" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" fill="#1D9E75" text-anchor="start" font-weight="600">5. Trend</text><text x="50" y="468" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">how is it changing over time?</text><text x="50" y="498" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">Rolling 6M / 12M volume, month-over-month growth %</text><rect x="390" y="424" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/><text x="431" y="439" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#1D9E75" text-anchor="middle" font-weight="600">pre-built</text><rect x="522" y="410" width="458" height="142" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><rect x="522" y="410" width="6" height="142" rx="3" fill="#534AB7"/><text x="544" y="444" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" fill="#534AB7" text-anchor="start" font-weight="600">6. Surveillance</text><text x="544" y="468" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">is anyone behaving oddly?</text><text x="544" y="498" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">Price vs market %, oversized clips — the demo</text><text x="544" y="516" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">highlight</text><rect x="884" y="424" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="925" y="439" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#534AB7" text-anchor="middle" font-weight="600">derive</text><rect x="28" y="568" width="924" height="52" rx="8" fill="#F7F9FB" stroke="#BFC9D4" stroke-width="1"/><text x="48" y="592" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#222222" text-anchor="start" font-weight="400">This is market-wide data (every participant). ‘Revenue’ = total across all 32 companies, not one firm’s P&amp;L.</text><text x="48" y="612" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Green = ready in the metric view · Amber = mind the caveat · Purple = derivable, the star Genie moment.</text></svg>