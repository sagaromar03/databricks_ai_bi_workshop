<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Market structure"><rect width="980" height="520" fill="#FFFFFF"/><rect x="0" y="0" width="980" height="58" fill="#0B4F6C"/><text x="28" y="32" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="20" fill="#FFFFFF" text-anchor="start" font-weight="600">Whose data is this?</text><text x="28" y="50" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#CFE0EC" text-anchor="start" font-weight="400">A market-wide trade tape — not one company’s books</text><text x="28" y="92" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Every row is one deal between two of the market’s participants. There is no single ‘us’.</text><circle cx="490" cy="300" r="92" fill="#EEF4F8" stroke="#0B4F6C" stroke-width="1.5"/><text x="490" y="292" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="17" fill="#0B4F6C" text-anchor="middle" font-weight="600">The market</text><text x="490" y="314" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">1.0M trades</text><text x="490" y="332" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">32 companies · 122 traders</text><rect x="415.0" y="125.0" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="490.0" y="146.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">Equinor</text><text x="490.0" y="164.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">producer</text><line x1="490" y1="208" x2="490" y2="174" stroke="#BFC9D4" stroke-width="1.2"/><rect x="591.776695296637" y="168.93398282201787" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="666.776695296637" y="189.93398282201787" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">Shell</text><text x="666.776695296637" y="207.93398282201787" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">major</text><line x1="555" y1="235" x2="638" y2="211" stroke="#BFC9D4" stroke-width="1.2"/><rect x="665.0" y="275.0" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="740.0" y="296.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">Kong Corp</text><text x="740.0" y="314.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">LNG producer</text><line x1="582" y1="300" x2="700" y2="300" stroke="#BFC9D4" stroke-width="1.2"/><rect x="591.776695296637" y="381.06601717798213" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#D85A30" stroke-width="1"/><text x="666.776695296637" y="402.06601717798213" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">Manta Res.</text><text x="666.776695296637" y="420.06601717798213" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">trader ⚠</text><line x1="555" y1="365" x2="638" y2="389" stroke="#BFC9D4" stroke-width="1.2"/><rect x="415.0" y="425.0" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="490.0" y="446.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">Nord Pool</text><text x="490.0" y="464.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">exchange</text><line x1="490" y1="392" x2="490" y2="426" stroke="#BFC9D4" stroke-width="1.2"/><rect x="238.22330470336317" y="381.06601717798213" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="313.22330470336317" y="402.06601717798213" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">EEX</text><text x="313.22330470336317" y="420.06601717798213" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">exchange</text><line x1="425" y1="365" x2="342" y2="389" stroke="#BFC9D4" stroke-width="1.2"/><rect x="165.0" y="275.0" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="240.0" y="296.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">RWE</text><text x="240.0" y="314.0" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">utility</text><line x1="398" y1="300" x2="280" y2="300" stroke="#BFC9D4" stroke-width="1.2"/><rect x="238.22330470336306" y="168.93398282201787" width="150" height="50" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="313.22330470336306" y="189.93398282201787" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#0B4F6C" text-anchor="middle" font-weight="600">Vitol</text><text x="313.22330470336306" y="207.93398282201787" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">trading house</text><line x1="425" y1="235" x2="342" y2="211" stroke="#BFC9D4" stroke-width="1.2"/><rect x="28" y="470" width="924" height="36" rx="8" fill="#F7F9FB" stroke="#BFC9D4" stroke-width="1"/><text x="48" y="493" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#222222" text-anchor="start" font-weight="400">Same company can be the trader on one row and the counterparty on another — the classic sign of exchange / regulator data.</text></svg>