<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Common join paths"><rect width="980" height="560" fill="#FFFFFF"/><rect x="0" y="0" width="980" height="58" fill="#0B4F6C"/><text x="28" y="32" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="20" fill="#FFFFFF" text-anchor="start" font-weight="600">Common join paths</text><text x="28" y="50" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#CFE0EC" text-anchor="start" font-weight="400">How the energy_trading tables connect for analysis</text><text x="28" y="92" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Read each arrow as ‘many → one’: many trades point to one trader, one hour, one instrument.</text><rect x="400" y="150" width="180" height="150" rx="10" fill="#EEF4F8" stroke="#0B4F6C" stroke-width="1"/><text x="490.0" y="176" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="15" fill="#0B4F6C" text-anchor="middle" font-weight="600">fact_trade</text><text x="490.0" y="198" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">1 row per trade</text><text x="490.0" y="222" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400">~1.0M rows</text><text x="490.0" y="254" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#D85A30" text-anchor="middle" font-weight="400">the market’s</text><text x="490.0" y="270" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#D85A30" text-anchor="middle" font-weight="400">trade tape</text><rect x="70" y="90" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="82" y="116" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#0B4F6C" text-anchor="start" font-weight="600">dim_trader</text><text x="82" y="136" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">who</text><line x1="260" y1="119" x2="400" y2="225.0" stroke="#BFC9D4" stroke-width="1.4"/><circle cx="406" cy="225.0" r="2.4" fill="#0B4F6C"/><rect x="70" y="225" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="82" y="251" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#0B4F6C" text-anchor="start" font-weight="600">dim_counterparty</text><text x="82" y="271" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">with whom</text><line x1="260" y1="254" x2="400" y2="225.0" stroke="#BFC9D4" stroke-width="1.4"/><circle cx="406" cy="225.0" r="2.4" fill="#0B4F6C"/><rect x="70" y="360" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="82" y="386" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#0B4F6C" text-anchor="start" font-weight="600">dim_instrument</text><text x="82" y="406" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">what</text><line x1="260" y1="389" x2="400" y2="225.0" stroke="#BFC9D4" stroke-width="1.4"/><circle cx="406" cy="225.0" r="2.4" fill="#0B4F6C"/><rect x="720" y="90" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="732" y="116" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#0B4F6C" text-anchor="start" font-weight="600">dim_time</text><text x="732" y="136" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">when</text><line x1="720" y1="119" x2="580" y2="225.0" stroke="#BFC9D4" stroke-width="1.4"/><circle cx="574" cy="225.0" r="2.4" fill="#0B4F6C"/><rect x="720" y="225" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="732" y="251" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#0B4F6C" text-anchor="start" font-weight="600">dim_market</text><text x="732" y="271" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">how</text><line x1="720" y1="254" x2="580" y2="225.0" stroke="#BFC9D4" stroke-width="1.4"/><circle cx="574" cy="225.0" r="2.4" fill="#0B4F6C"/><rect x="720" y="360" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#3A6EA5" stroke-width="1"/><text x="732" y="386" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#0B4F6C" text-anchor="start" font-weight="600">dim_delivery_point</text><text x="732" y="406" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">where</text><line x1="720" y1="389" x2="580" y2="225.0" stroke="#BFC9D4" stroke-width="1.4"/><circle cx="574" cy="225.0" r="2.4" fill="#0B4F6C"/><rect x="720" y="445" width="190" height="58" rx="8" fill="#F7F9FB" stroke="#534AB7" stroke-width="1"/><text x="732" y="471" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="13" fill="#534AB7" text-anchor="start" font-weight="600">dim_geography</text><text x="732" y="491" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">country / continent</text><line x1="815" y1="418" x2="815" y2="445" stroke="#BFC9D4" stroke-width="1.4"/><text x="828" y="436" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="400">snowflake hop</text><rect x="360" y="360" width="120" height="52" rx="8" fill="#FBF1E7" stroke="#BA7517" stroke-width="1"/><text x="420" y="384" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="12" fill="#BA7517" text-anchor="middle" font-weight="600">fact_position</text><text x="420" y="401" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">net long / short</text><rect x="500" y="360" width="120" height="52" rx="8" fill="#FBF1E7" stroke="#BA7517" stroke-width="1"/><text x="560" y="384" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#BA7517" text-anchor="middle" font-weight="600">fact_market_price</text><text x="560" y="401" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="400">the referee</text><line x1="440" y1="300" x2="430" y2="360" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="4 3"/><text x="300" y="335" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="10" fill="#D85A30" text-anchor="start" font-weight="400">aggregates to →</text><line x1="560" y1="300" x2="560" y2="360" stroke="#BFC9D4" stroke-width="1.2" stroke-dasharray="4 3"/><text x="28" y="540" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400">Tip: to reach country/continent, join fact_trade → dim_delivery_point → dim_geography (two hops).</text></svg>